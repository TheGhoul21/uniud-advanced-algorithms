<script>
document.addEventListener('DOMContentLoaded', function() {
  // Populate page name from the title
  var t = document.querySelector('h1.title');
  var el = document.getElementById('aa-page-name');
  if (t && el) el.textContent = t.textContent;

  // Move topbar to the very top of body
  var bar = document.getElementById('aa-topbar');
  if (bar) document.body.insertBefore(bar, document.body.firstChild);

  // Move sidebar right after topbar
  var sidebar = document.getElementById('aa-sidebar');
  if (sidebar && bar) bar.after(sidebar);

  // Highlight active page in sidebar
  var path = window.location.pathname;
  document.querySelectorAll('.aa-sidebar-link[data-page]').forEach(function(link) {
    if (path.indexOf(link.dataset.page) !== -1) {
      link.classList.add('active');
    }
  });

  // Hide title block and Quarto sidebar
  var tb = document.getElementById('title-block-header');
  if (tb) tb.style.display = 'none';
  var ms = document.getElementById('quarto-margin-sidebar');
  if (ms) ms.style.display = 'none';

  // Wrap Quarto content in a flex layout with the sidebar
  var content = document.getElementById('quarto-content');
  if (sidebar && content) {
    var wrapper = document.createElement('div');
    wrapper.id = 'aa-layout';
    sidebar.after(wrapper);
    wrapper.appendChild(sidebar);
    wrapper.appendChild(content);
  }
});
</script>
